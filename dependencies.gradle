// Add your dependencies here
configurations.create('gtnhlibEmbed') {
    canBeConsumed = false
    canBeResolved = true
}

dependencies {
    api('com.github.GTNewHorizons:CodeChickenCore:1.4.22:dev')
    devOnlyNonPublishable('com.github.GTNewHorizons:GTNHLib:0.11.54:dev')

    shadowImplementation('org.apache.commons:commons-csv:1.10.0')

    compileOnly('maven.modrinth:forge-essentials:7.5.1')
    compileOnly('com.cardinalstar.cubicchunks:CubicChunks1710:v0.1.14-alpha:dev')

    antlr('org.antlr:antlr4:4.13.2')
    shadowImplementation('org.antlr:antlr4-runtime:4.13.2')

    testImplementation(platform('org.junit:junit-bom:5.13.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation("org.mockito:mockito-core:5.+")

    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testRuntimeOnly("org.lwjgl.lwjgl:lwjgl:2.9.3");

    compileOnly("com.github.GTNewHorizons:GTNHLib:0.11.54") { transitive = false }
    gtnhlibEmbed("com.github.GTNewHorizons:GTNHLib:0.11.54") { transitive = false }

//    compileOnly('com.github.GTNewHorizons:GT5-Unofficial:5.09.54.254')
    compileOnly("com.github.GTNewHorizons:GT5-Unofficial:5.09.52.463:dev") { transitive = false }
    compileOnly('com.github.GTNewHorizons:ForestryMC:4.11.40:dev')
    compileOnly('com.github.GTNewHorizons:TinkersConstruct:1.14.123-GTNH:dev')
}

def embedArchiveOperations = gtnhGradle.archiveOperations
def gtnhlibEmbedContents = configurations.gtnhlibEmbed.elements.map { files ->
    files.collect { embedArchiveOperations.zipTree(it.asFile) }
}

[tasks.jar, tasks.shadowJar].each {
    it.configure {
        from(gtnhlibEmbedContents) {
            include 'com/gtnewhorizon/gtnhlib/color/ColorResource.class'
            include 'com/gtnewhorizon/gtnhlib/color/ColorResource$*.class'
        }
    }
}
